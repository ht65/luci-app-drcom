name: build-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 前端语法检查
        run: node --check root/www/luci-static/resources/view/drcom/overview.js

      - name: Shell 语法检查
        run: |
          set -euo pipefail
          for f in install.sh uninstall.sh \
                   root/etc/init.d/drcom \
                   root/etc/hotplug.d/iface/95-drcom \
                   root/usr/sbin/drcom-portal \
                   root/usr/libexec/rpcd/drcom; do
            echo "== $f"
            sh -n "$f"
          done

      - name: 检查换行符（必须全是 LF）
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 -r grep -lU $'\r'; then
            echo "::error::发现 CRLF 换行符，路由器上的 ash 会直接报语法错误"
            exit 1
          fi
          echo "全部为 LF"

      - name: 检查 JSON 合法性
        run: |
          set -euo pipefail
          python3 -m json.tool root/usr/share/luci/menu.d/luci-app-drcom.json > /dev/null
          python3 -m json.tool root/usr/share/rpcd/acl.d/luci-app-drcom.json > /dev/null

      - name: Python 工具语法检查
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build-package.py tools/changelog-section.py

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 发版说明来自 CHANGELOG.md 的对应段落；缺段落就直接失败，
      # 免得发出一个没有「改动/新增」说明的版本。放在最前面是为了快速失败（不浪费 SDK 下载）。
      - name: 检查并提取本版改动说明
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # 标签、Makefile 版本、CHANGELOG 段落必须一致，否则发布资产的版本名会对不上
          v="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::Makefile PKG_VERSION=$v 与标签 ${GITHUB_REF_NAME} 不一致"; exit 1; }
          mkdir -p dist
          python3 tools/changelog-section.py "${GITHUB_REF_NAME}" > dist/release-notes.md
          echo "::group::本版说明"
          cat dist/release-notes.md
          echo "::endgroup::"

      - name: 下载 SDK
        run: |
          set -euo pipefail
          URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic/immortalwrt-sdk-25.12.2-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          echo "::group::下载 $URL"
          wget -q "$URL" -O sdk.tar.zst
          ls -lh sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm -f sdk.tar.zst
          echo "::endgroup::"

      - name: 配置 apk 签名
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APK_SIGNING_KEY:-}" ]; then
            echo "::error::缺少 APK_SIGNING_KEY secret，无法签名"
            exit 1
          fi
          # 私钥只写到 SDK 根目录，供 package-pack.mk 使用
          printf '%s\n' "$APK_SIGNING_KEY" > sdk/private-key.pem
          chmod 600 sdk/private-key.pem
          cp keys/drcom.pem sdk/public-key.pem
          # ImmortalWrt 25.12 SDK 的 package-pack.mk 默认不签单个 apk，这里补上 --sign
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('sdk/include/package-pack.mk')
          s = p.read_text(encoding='utf-8')
          if '--sign' not in s:
              needle = '\t  --output "$$(PACK_$(1))"'
              if needle not in s:
                  raise SystemExit('package-pack.mk: --output line not found')
              s = s.replace(needle, needle + ' \\\n\t  $$(if $$(wildcard $$(BUILD_KEY_APK_SEC)),--sign "$$(BUILD_KEY_APK_SEC)",)')
              p.write_text(s, encoding='utf-8')
          PY
          grep -n -- '--sign' sdk/include/package-pack.mk

      - name: 编译
        run: |
          set -euo pipefail
          mkdir -p sdk/package/luci-app-drcom
          cp -r root Makefile sdk/package/luci-app-drcom/
          cd sdk
          make defconfig
          make package/luci-app-drcom/compile V=s -j"$(nproc)"

      - name: 检查产物
        run: |
          set -euo pipefail
          # 只认本包，避免把 SDK 里其它 *.apk 当成产物
          find sdk/bin/packages -name 'luci-app-drcom-*.apk' -type f -print
          test -n "$(find sdk/bin/packages -name 'luci-app-drcom-*.apk' -type f -print -quit)"

      - name: 验证 apk 签名
        run: |
          set -euo pipefail
          # 用发布公钥校验产物确实被签名；未签名或签错会让这里失败
          apk="$(find sdk/bin/packages -name 'luci-app-drcom-*.apk' -type f -print -quit)"
          test -n "$apk"
          mkdir -p /tmp/apk-keys
          cp keys/drcom.pem /tmp/apk-keys/
          # 不要覆盖 runner 的 LD_LIBRARY_PATH，否则会加载 SDK 里的 glibc 导致命令起不来
          sdk/staging_dir/host/bin/apk --keys-dir /tmp/apk-keys verify "$apk"

      - name: 打包 tar.gz 安装包
        run: |
          set -euo pipefail
          # 用提交时间做 mtime，让产物可复现
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 tools/build-package.py

      - name: 准备发布文件
        run: |
          set -euo pipefail
          # Release 挂 3 个文件：apk、tar.gz、公钥
          #   luci-app-drcom-<版本>-r1.apk
          #   luci-app-drcom-<版本>.tar.gz
          #   drcom.pem
          apk="$(find sdk/bin/packages -name 'luci-app-drcom-*.apk' -type f -print -quit)"
          tarball="$(find dist -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          test -n "$apk"
          test -n "$tarball"
          mkdir -p release
          cp "$apk" "release/$(basename "$apk")"
          cp "$tarball" "release/$(basename "$tarball")"
          cp keys/drcom.pem release/drcom.pem
          ls -lh release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-drcom
          path: release/*
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 正文取自上一步从 CHANGELOG.md 提取的段落
          body_path: dist/release-notes.md
          files: release/*
