name: build-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 前端语法检查
        run: node --check root/www/luci-static/resources/view/drcom/overview.js

      - name: Shell 语法检查
        run: |
          set -euo pipefail
          for f in install.sh uninstall.sh \
                   root/etc/init.d/drcom \
                   root/etc/hotplug.d/iface/95-drcom \
                   root/usr/sbin/drcom-portal \
                   root/usr/libexec/rpcd/drcom; do
            echo "== $f"
            sh -n "$f"
          done

      - name: 检查换行符（必须全是 LF）
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 -r grep -lU $'\r'; then
            echo "::error::发现 CRLF 换行符，路由器上的 ash 会直接报语法错误"
            exit 1
          fi
          echo "全部为 LF"

      - name: 检查 JSON 合法性
        run: |
          set -euo pipefail
          python3 -m json.tool root/usr/share/luci/menu.d/luci-app-drcom.json > /dev/null
          python3 -m json.tool root/usr/share/rpcd/acl.d/luci-app-drcom.json > /dev/null

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 下载 SDK
        run: |
          set -euo pipefail
          URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic/immortalwrt-sdk-25.12.2-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          echo "::group::下载 $URL"
          wget -q "$URL" -O sdk.tar.zst
          ls -lh sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm -f sdk.tar.zst
          echo "::endgroup::"

      - name: 编译
        run: |
          set -euo pipefail
          mkdir -p sdk/package/luci-app-drcom
          cp -r root Makefile sdk/package/luci-app-drcom/
          cd sdk
          make defconfig
          make package/luci-app-drcom/compile V=s -j"$(nproc)"

      - name: 检查产物
        run: |
          set -euo pipefail
          find sdk/bin/packages -name '*.apk' -type f -print
          test -n "$(find sdk/bin/packages -name '*.apk' -type f -print -quit)"

      - name: 打包 tar.gz 安装包
        run: |
          set -euo pipefail
          # 用提交时间做 mtime，让产物可复现
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 tools/build-package.py

      - name: 准备发布文件
        run: |
          set -euo pipefail
          # 只用不带版本号的固定名，每个 Release 就两个文件：
          # README 里的 releases/latest/download 链接才能长期有效，也不用带版本副本。
          apk="$(find sdk/bin/packages -name '*.apk' -type f -print -quit)"
          tarball="$(find dist -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          test -n "$apk"
          test -n "$tarball"
          mkdir -p release
          cp "$apk" release/luci-app-drcom.apk
          cp "$tarball" release/luci-app-drcom.tar.gz
          ls -lh release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-drcom
          path: release/*
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
